<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Tools — Practical tools for Scout leaders</title>
  <meta name="description" content="Free, simple tools for Beaver, Cub and Scout leaders. Find a game for your meeting or put together a printable kit list for camp.">
  <meta name="theme-color" content="#590fa9">
  <meta name="theme-color" content="#00132b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900;1,6..12,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <meta property="og:title" content="Scout Tools">
  <meta property="og:description" content="Free, simple tools for Beaver, Cub and Scout leaders.">
  <meta property="og:type" content="website">
  <script type="module" src="assets/js/home.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header data-root="./" data-active="home"></header>

  <main id="main">
    <section class="hero">
      <div class="container hero__inner">
        <p class="hero__eyebrow">Scout Tools</p>
        <h1>Practical tools for Scout leaders</h1>
        <p class="hero__lead">Free, straightforward tools for Beaver, Cub and Scout meetings and camps. Find a game, build a kit list, and get back to planning.</p>
        <div class="hero__stats" aria-label="Toolbox summary">
          <span><strong data-tool-count>2</strong> tools</span>
          <span><strong>Beavers, Cubs &amp; Scouts</strong></span>
          <span><strong>Free</strong>, no sign-in needed</span>
        </div>
      </div>
    </section>

    <noscript>
      <div class="container mt-6">
        <div class="error-panel">
          <strong>JavaScript is needed to load the tool cards here.</strong>
          <span>Enable JavaScript, or open the <a href="games/">Games Finder</a> or <a href="kit-list/">Kit List Generator</a> directly.</span>
        </div>
      </div>
    </noscript>

    <section class="tools" id="tools" aria-labelledby="tools-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Toolbox</p>
            <h2 id="tools-title">Pick a tool</h2>
          </div>
        </div>
        <div class="tools__grid" id="tool-grid">
          <div class="loading">
            <span class="spinner" aria-hidden="true"></span>
            Loading tools…
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-site-footer data-root="./"></footer>
