name: Import game submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: game-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event.issue.state == 'open' && contains(github.event.issue.body, 'GAME_SUBMISSION_START')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import the submission
        id: import
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/import-issue.mjs

      - name: Commit the new game
        if: steps.import.outputs.status == 'added'
        env:
          GAME_TITLE: ${{ steps.import.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "Add game: $GAME_TITLE"
          git push

      - name: Comment and close the issue
        if: steps.import.outputs.status == 'added'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks! This game has been added to the library. The site will update once the change is deployed.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on a problem
        if: steps.import.outputs.status == 'invalid'
        uses: actions/github-script@v7
        env:
          IMPORT_MESSAGE: ${{ steps.import.outputs.message }}
        with:
          script: |
            const message = process.env.IMPORT_MESSAGE || "The submission could not be added.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This submission could not be added:\n\n${message}\n\nPlease check the game form and update the issue, or ask a maintainer for help.`,
            });

      - name: Fail the run when the submission is invalid
        if: steps.import.outputs.status == 'invalid'
        run: exit 1
