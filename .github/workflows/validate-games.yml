name: Validate games

on:
  push:
    paths:
      - "data/games.json"
      - "scripts/**"
      - "assets/js/**"
      - ".github/workflows/validate-games.yml"
  pull_request:
    paths:
      - "data/games.json"
      - "scripts/**"
      - "assets/js/**"
      - ".github/workflows/validate-games.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data/games.json
        run: node scripts/validate-games.mjs
